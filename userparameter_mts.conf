# MTS Business API -> UserParameter'ы для zabbix-agent2 (mts-mon)
# Ключи совпадают с item'ами шаблона "MTS Business API".
UserParameter=mts.names.raw,/etc/zabbix/scripts/mts_balance.py discovery
UserParameter=mts.balance[*],/etc/zabbix/scripts/mts_balance.py balance $1
UserParameter=mts.voice[*],/etc/zabbix/scripts/mts_balance.py voice $1
UserParameter=mts.sms[*],/etc/zabbix/scripts/mts_balance.py sms $1
UserParameter=mts.net[*],/etc/zabbix/scripts/mts_balance.py net $1
UserParameter=mts.netpct[*],/etc/zabbix/scripts/mts_balance.py netpct $1
